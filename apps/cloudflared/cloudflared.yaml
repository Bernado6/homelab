# cloudflared: outbound-only tunnel from the cluster to Cloudflare's edge.
# Walkthrough: docs/11-public-access/23-cloudflare-tunnel.md
#
# Prerequisites (one-off, in the Cloudflare dashboard):
#   1. A domain on Cloudflare.
#   2. Zero Trust -> Networks -> Tunnels -> Create tunnel -> copy the token.
#   3. kubectl create namespace cloudflared
#      kubectl -n cloudflared create secret generic tunnel-token --from-literal=token='<token>'
#   4. Public hostnames in the tunnel config (apex and www):
#        benardkipngeno.com      ->  http://portfolio.portfolio.svc.cluster.local:80
#        www.benardkipngeno.com  ->  http://portfolio.portfolio.svc.cluster.local:80
#
#   kubectl apply -f apps/cloudflared/cloudflared.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Two replicas = two independent connections to Cloudflare. A pod restart
  # or rollout never drops the public site.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        # Pin to a release from https://github.com/cloudflare/cloudflared/releases
        # Cloudflare marks releases older than about a year "Unsupported" in the
        # dashboard; bump this tag a few times a year. 2026.10.6 as of 2026-10-29.
        image: cloudflare/cloudflared:2026.10.6
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: tunnel-token
              key: token
        ports:
        - { name: metrics, containerPort: 2000 }
        livenessProbe:
          httpGet: { path: /ready, port: metrics }
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /ready, port: metrics }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
